name: Probe job boards (one-off test)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch sample pages
        run: |
          mkdir -p pages
          UA='Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          get () { curl -sS -L -A "$UA" -H 'Accept-Language: en-GB,en;q=0.9' --max-time 40 -o "pages/$1" -w "$1 %{http_code} %{size_download} %{url_effective}\n" "$2" || echo "$1 FAILED"; }
          get linkedin.html     "https://www.linkedin.com/jobs-guest/jobs/api/seeMoreJobPostings/search?keywords=financial%20analyst&location=United%20Kingdom&f_TPR=r86400&start=0"
          get s1jobs.html       "https://www.s1jobs.com/jobs/?keywords=financial+analyst"
          get myjobscot.html    "https://www.myjobscotland.gov.uk/search-jobs?keywords=finance"
          get reed.html         "https://www.reed.co.uk/jobs/financial-analyst-jobs?dateCreatedOffSet=today"
          get scotjobs_home.html "https://scotjobsnet.co.uk/"
          get scotjobs_s.html   "https://scotjobsnet.co.uk/?s=finance"
          get scotjobs_jobs.html "https://scotjobsnet.co.uk/jobs/?search_keywords=finance"
          get scotjobs_feed.xml "https://scotjobsnet.co.uk/?feed=job_feed&search_keywords=finance"
          get nhs_job.html      "https://apply.jobs.scot.nhs.uk/Home/Job"
          get nhs_main.html     "https://jobs.scot.nhs.uk/"
          get findajob.html     "https://findajob.dwp.gov.uk/search?q=finance"
      - name: Print page structure
        run: |
          python3 - <<'PY'
          import re, html, os
          pats = {
            'linkedin.html': r'base-search-card__title|job-search-card__location|<time|href="https://uk\.linkedin\.com/jobs/view/',
            's1jobs.html': r'/job/|__NEXT_DATA__|"jobTitle"|"title":',
            'myjobscot.html': r'/apply\?jobId=',
            'reed.html': r'data-qa="job-card|/jobs/[a-z0-9-]+/\d{6,}|__NEXT_DATA__',
            'scotjobs_jobs.html': r'/job/|job_listing|job-title',
            'scotjobs_s.html': r'/job/|job_listing',
            'nhs_job.html': r'/Home/Job/|JobDetail|job-title|<form|action=',
            'findajob.html': r'.',
          }
          for f, pat in pats.items():
              t = open('pages/' + f, encoding='utf-8', errors='ignore').read()
              print('#' * 20, f, len(t), 'matches', len(re.findall(pat, t)))
              shown = 0
              last = -10**9
              for m in re.finditer(pat, t):
                  if m.start() - last < 1500: continue
                  last = m.start()
                  chunk = re.sub(r'\s+', ' ', t[max(0, m.start()-300): m.start()+900])
                  print('  >>', chunk[:1200])
                  shown += 1
                  if shown >= (1 if f == 'findajob.html' else 2): break
          PY

