# UK startups and SMEs scanned every hour by scripts/startups.mjs, using each
# hiring system's public job-board API (no scraping):
#
#   greenhouse  https://boards-api.greenhouse.io/v1/boards/<slug>/jobs
#   lever       https://api.lever.co/v0/postings/<slug>?mode=json   (add `region: eu` for api.eu.lever.co)
#   ashby       https://api.ashbyhq.com/posting-api/job-board/<slug>
#   workable    https://apply.workable.com/api/v1/widget/accounts/<slug>
#
# HOW TO ADD A COMPANY
#   1. Open one of the company's job ads and look at the address bar:
#        job-boards.greenhouse.io/<slug>/...   or boards.greenhouse.io/<slug>  -> ats: greenhouse
#        jobs.lever.co/<slug>/...              (jobs.eu.lever.co -> region: eu) -> ats: lever
#        jobs.ashbyhq.com/<slug>/...                                             -> ats: ashby
#        apply.workable.com/<slug>/...                                           -> ats: workable
#   2. Add a line below:   - { name: Company Name, ats: greenhouse, slug: theslug }
#   3. Optional: run "Check startup list" in the GitHub Actions tab to confirm
#      the slug works and see how many UK roles it has.
# A company's first scan records its open roles without alerting; after that
# you're alerted to new postings only. Firms already in portals.yml are
# skipped automatically, so there are no duplicate alerts.
#
# `verified:` is filled in by the check workflow (date the slug last answered).

