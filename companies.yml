# UK finance employers the weekly discovery job tries to add to portals.yml.
#
# For each company the job:
#   1. asks career-ops' discover-ats.mjs to find a Greenhouse / Lever / Ashby /
#      Workable / SmartRecruiters / Pinpoint / etc. board from the name;
#   2. if that fails, scripts/find-ats.mjs opens the company's website and
#      careers pages and looks for links to a hiring system career-ops can scan
#      (Workday, Oracle, Eightfold, iCIMS, Taleo, Teamtailor, ...).
# Anything found is appended to portals.yml. Anything still not found is listed
# in reports/discovery.md, so you know which firms to check by hand.
#
# Add or remove firms freely: `name` is required, `website` helps a lot,
# `careers` (the careers page URL) helps most.

