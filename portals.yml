# Finance Job Radar: career-ops scanner config for junior UK finance roles.
# Read by career-ops scan.mjs (pinned in .github/workflows/scan.yml).
#
# What gets through to Slack:
#   1. Title matches at least one `positive` keyword and no `negative` keyword
#   2. Title is not senior (skip_tiers: senior drops Senior/Lead/VP/Director/Head of...)
#   3. Location is in the UK (or the posting gives no location)
#   4. The description does not say "no visa sponsorship" (where the board shows one)
#   5. Posted in the last 30 days (where the board gives a date)
#
# Edit the keyword lists freely. Matching is case-insensitive substring;
# `word:` means whole word only.

skip_tiers: [senior]

max_posting_age_days: 30

title_filter:
  positive:
    # Titles must name a finance function. Bare "Analyst" / "Associate" let in
    # too much (business, data, AML, compliance analysts), so they are paired
    # with a finance word instead (" + " means both words, any order).
    # -- FP&A / financial analysis / accounting --
    - "Financial Analyst"
    - "Finance Analyst"
    - "Finance Associate"
    - "FP&A"
    - "Financial Planning"
    - "Finance Business Partner"
    - "Commercial Finance"
    - "Commercial Analyst"
    - "Pricing Analyst"
    - "Management Accountant"
    - "Assistant Accountant"
    - "Financial Accountant"
    - "Trainee Accountant"
    - "Fund Accountant"
    - "Fund Accounting"
    - "Financial Reporting"
    - "Product Control"
    - "Treasury"
    - "Financial Controller"
    - "Finance Transformation"
    - "Accountant"
    # -- Credit & risk --
    - "Credit"
    - "Risk Analyst"
    - "Risk Associate"
    - "Market Risk"
    - "Liquidity Risk"
    - "Model Risk"
    - "Counterparty Risk"
    - "Prudential Risk"
    - "Underwriting Analyst"
    # -- Investment banking / advisory --
    - "Investment Banking"
    - "M&A"
    - "Mergers"
    - "Corporate Finance"
    - "Transaction Services"
    - "Deal Advisory"
    - "Strategic Advisory"
    - "Debt Advisory"
    - "Capital Advisory"
    - "Financial Advisory"
    - "word:Debt"
    - "Valuation"
    - "Restructuring"
    - "Capital Markets"
    - "Leveraged Finance"
    - "Structured Finance"
    - "Corporate Banking"
    # -- Research / markets --
    - "Equity Research"
    - "Investment Research"
    - "Research Analyst"
    - "Trader"
    - "Trading Analyst"
    - "Trading Assistant"
    - "Quant"
    # -- Asset & wealth management / private markets --
    - "Investment Analyst"
    - "Investment Associate"
    - "Investment Management"
    - "Investment Operations"
    - "Asset Management"
    - "Portfolio Analyst"
    - "Portfolio Analytics"
    - "Portfolio Management"
    - "Fund Analyst"
    - "Private Equity"
    - "Private Credit"
    - "Private Markets"
    # -- Consulting --
    - "Management Consultant"
    - "Strategy Consultant"
    - "Strategy Analyst"
    - "Strategy Associate"
    - "Financial Services Consult"
    # -- Graduate programmes with a finance focus --
    - "word:Analyst Programme"
    - "graduate + finance"
    - "graduate + financial"
    - "graduate + risk"
    - "graduate + investment"
    - "graduate + banking"
    - "graduate + markets"
    - "graduate + accountan"
    - "graduate + treasury"

  negative:
    # Seniority not caught by skip_tiers
    - "Manager"
    - "Managing Director"
    - "Executive Director"
    - "Vice President"
    - "word:VP"
    - "word:AVP"
    - "Head of"
    - "Chief"
    - "Associate Partner"
    - "Equity Partner"
    - "Salaried Partner"
    - "word:Principal"
    # Student programmes (you have graduated)
    - "word:Intern"
    - "word:Interns"
    - "Internship"
    - "Placement"
    - "Summer"
    - "Spring Week"
    - "Spring Insight"
    - "Insight Programme"
    - "Off-Cycle"
    - "Apprentice"
    - "Work Experience"
    # Finance-adjacent roles that are not your target
    - "Business Analyst"
    - "Data Analyst"
    - "word:AML"
    - "word:KYC"
    - "Financial Crime"
    - "Compliance"
