# UK only. Order the scanner uses: always_allow wins, then block, then allow.
# Postings with no location pass (strict is off), so nothing is lost silently.
location_filter:
  # block_hard is checked first, so "Sydney, New South Wales" can't sneak in
  # through "Wales", or "London, Ontario" through "London".
  block_hard:
    - "New South Wales"
    - "Sydney"
    - "Ontario"
    - "Kentucky"
    - "New London"
  always_allow:
    - "United Kingdom"
    - "UK"
    - "U.K."
    - "Great Britain"
    - "England"
    - "Scotland"
    - "Wales"
    - "Northern Ireland"
    - "London"
    - "GBR"
  block:
    # US / Canada / elsewhere places that share a UK city name
    - "United States"
    - "USA"
    - "New York"
    - "Massachusetts"
    - "Alabama"
    - "New Hampshire"
    - "North Carolina"
    - "Pennsylvania"
    - "Virginia"
    - "Connecticut"
    - "Ontario"
    - "Nova Scotia"
    - "Canada"
    - "Jamaica"
    - "Australia"
    - "India"
    # US / Canadian state codes as they appear in "Cambridge, MA" style locations
    - "MA"
    - "NC"
    - "NH"
    - "PA"
    - "VA"
    - "CT"
    - "NY"
    - "AL"
    - "NS"
  allow:
