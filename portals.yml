    - "Volunteer"
    - "Reporter"
    - "Journalist"
    - "Leader"
    - "Resilience"
    - "Credit Control"
    - "Credit Card"
    # Tech / non-finance
    - "Software"
    - "Engineer"
    - "Developer"
    - "DevOps"
    - "Cyber"
    - "Security Analyst"
    - "SOC Analyst"
    - "Network"
    - "Infrastructure"
    - "Cloud"
    - "Data Scientist"
